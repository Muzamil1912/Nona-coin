<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaCoin (NVC) | Premium Crypto Mining</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "#0a0a0b",
            foreground: "#ededed",
            premium: {
              charcoal: "#0f0f11",
              gold: "#d4af37",
              neon: "#00f3ff",
              purple: "#7c3aed",
              card: "rgba(18, 18, 20, 0.7)"
            }
          },
          backgroundImage: {
            "premium-gradient": "linear-gradient(135deg, #00f3ff 0%, #7c3aed 100%)"
          },
          boxShadow: {
            "neon-glow": "0 0 20px rgba(0, 243, 255, 0.3)",
            "purple-glow": "0 0 20px rgba(124, 58, 237, 0.3)"
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0b;
      color: #ededed;
    }

    .glass-card {
      background: rgba(18, 18, 20, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .neon-text {
      color: #00f3ff;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .animate-pulse-glow {
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
      }

      50% {
        opacity: 0.8;
      }

      100% {
        opacity: 0.4;
      }
    }

    .sidebar-link.active {
      background: linear-gradient(135deg, #00f3ff 0%, #7c3aed 100%);
      color: white;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }
  </style>
</head>

<body class="overflow-x-hidden">
  <!-- Navbar -->
  <nav
    class="fixed top-0 left-0 right-0 h-16 bg-background/80 backdrop-blur-md border-b border-white/5 z-50 px-6 flex items-center justify-between">
    <div class="flex items-center gap-3 cursor-pointer" onclick="showPage('home')">
      <div
        class="w-10 h-10 rounded-full bg-premium-gradient flex items-center justify-center border border-white/20 shadow-neon-glow overflow-hidden">
        <img src="./frontend/public/images/NovaCoin_Transparent_Logo.png" alt="NVC" class="w-full h-full object-cover">
      </div>
      <span class="text-xl font-black tracking-tighter text-white uppercase italic">
        NOVA<span class="neon-text">COIN</span> <span
          class="text-[10px] bg-white/10 px-1.5 py-0.5 rounded ml-1 text-white/40 not-italic">NVC</span>
      </span>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="showPage('login')"
        class="text-sm font-bold text-white/60 hover:text-white transition">Login</button>
      <button onclick="showPage('register')"
        class="bg-premium-gradient px-5 py-2 rounded-lg text-sm font-bold shadow-neon-glow hover:scale-105 transition-all">Sign
        Up</button>
    </div>
  </nav>

  <!-- Sidebar (Only shown in dashboard pages) -->
  <aside id="sidebar"
    class="fixed left-0 top-0 h-screen w-64 bg-background border-r border-white/5 pt-20 px-4 hidden lg:hidden">
    <div class="space-y-2">
      <div onclick="showPage('dashboard')"
        class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer text-white/60 hover:bg-white/5 transition">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="font-medium">Dashboard</span>
      </div>
      <div onclick="showPage('mining')"
        class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer text-white/60 hover:bg-white/5 transition">
        <i data-lucide="pickaxe" class="w-5 h-5"></i>
        <span class="font-medium">Mining</span>
      </div>
      <div onclick="showPage('wallet')"
        class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer text-white/60 hover:bg-white/5 transition">
        <i data-lucide="wallet" class="w-5 h-5"></i>
        <span class="font-medium">Wallet</span>
      </div>
      <div onclick="showPage('shop')"
        class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer text-white/60 hover:bg-white/5 transition">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span class="font-medium">Shop</span>
      </div>
      <div onclick="showPage('referral')"
        class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl cursor-pointer text-white/60 hover:bg-white/5 transition">
        <i data-lucide="users" class="w-5 h-5"></i>
        <span class="font-medium">Referral</span>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main id="main-content" class="pt-24 px-6 md:px-10 pb-10 min-h-screen">
    <!-- Page contents will be injected here -->
  </main>

  <script>
    const pages = {
      home: `
                <section class="text-center space-y-8 relative py-20">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-premium-neon/10 rounded-full blur-[120px] pointer-events-none"></div>
                    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 text-xs font-bold text-premium-neon uppercase tracking-widest shadow-neon-glow mb-4 animate-pulse-glow">
                        <i data-lucide="zap" class="w-4 h-4"></i>
                        Next-Gen Mining Platform
                    </div>
                    <h1 class="text-5xl md:text-7xl font-black tracking-tight leading-[1.1] text-white italic">
                        MINE <span class="neon-text">NOVA</span>COIN <br/>EARN THE FUTURE.
                    </h1>
                    <p class="text-white/60 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed">
                        The global cryptocurrency brand ready for mass adoption. Start your professional mining journey today.
                    </p>
                    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mt-10">
                        <button onclick="showPage('register')" class="w-full sm:w-auto bg-premium-gradient text-white font-black py-4 px-10 rounded-xl text-lg uppercase tracking-widest shadow-neon-glow hover:scale-105 transition-all">Join Now</button>
                        <button onclick="showPage('login')" class="w-full sm:w-auto border border-white/20 text-white font-black py-4 px-10 rounded-xl text-lg uppercase tracking-widest hover:bg-white/5 transition">Login</button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-32 text-left">
                        <div class="glass-card p-8 rounded-2xl">
                            <div class="w-12 h-12 rounded-xl bg-premium-neon/10 flex items-center justify-center text-premium-neon mb-6">
                                <i data-lucide="pickaxe"></i>
                            </div>
                            <h3 class="text-xl font-bold mb-2">Cloud Mining</h3>
                            <p class="text-white/50 text-sm">Automated mining infrastructure with 99.9% uptime.</p>
                        </div>
                        <div class="glass-card p-8 rounded-2xl">
                            <div class="w-12 h-12 rounded-xl bg-premium-purple/10 flex items-center justify-center text-premium-purple mb-6">
                                <i data-lucide="shield"></i>
                            </div>
                            <h3 class="text-xl font-bold mb-2">Secure Wallet</h3>
                            <p class="text-white/50 text-sm">Protected by multi-sig encryption protocols.</p>
                        </div>
                        <div class="glass-card p-8 rounded-2xl">
                            <div class="w-12 h-12 rounded-xl bg-premium-gold/10 flex items-center justify-center text-premium-gold mb-6">
                                <i data-lucide="trending-up"></i>
                            </div>
                            <h3 class="text-xl font-bold mb-2">High Yield</h3>
                            <p class="text-white/50 text-sm">Competitive ROI on all mining node subscriptions.</p>
                        </div>
                    </div>
                </section>
            `,
      login: `
                <div class="flex items-center justify-center min-h-[70vh]">
                    <div class="glass-card p-10 rounded-2xl w-full max-w-md">
                        <h2 class="text-3xl font-black text-white italic mb-2">WELCOME <span class="neon-text">BACK</span></h2>
                        <p class="text-white/40 text-sm mb-8">Enter your credentials to access your terminal.</p>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-black uppercase tracking-widest text-white/40 mb-2">Email Address</label>
                                <input type="email" placeholder="agent@novacoin.io" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-premium-neon transition">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black uppercase tracking-widest text-white/40 mb-2">Password</label>
                                <input type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-premium-neon transition">
                            </div>
                            <button onclick="showPage('dashboard')" class="w-full bg-premium-gradient py-4 rounded-xl font-black uppercase tracking-widest shadow-neon-glow mt-2 hover:scale-[1.02] active:scale-95 transition">Authorize</button>
                        </div>
                        <p class="text-center text-sm text-white/40 mt-8">Don't have access? <span onclick="showPage('register')" class="neon-text font-bold cursor-pointer hover:underline">Request Core</span></p>
                    </div>
                </div>
            `,
      register: `
                <div class="flex items-center justify-center min-h-[70vh]">
                    <div class="glass-card p-10 rounded-2xl w-full max-w-md">
                        <h2 class="text-3xl font-black text-white italic mb-2">JOIN <span class="neon-text">NOVA</span></h2>
                        <p class="text-white/40 text-sm mb-8">Establish your node in the global mining grid.</p>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-black uppercase tracking-widest text-white/40 mb-2">Full Name</label>
                                <input type="text" placeholder="John Nova" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-premium-neon transition">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black uppercase tracking-widest text-white/40 mb-2">Email Address</label>
                                <input type="email" placeholder="agent@novacoin.io" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-premium-neon transition">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black uppercase tracking-widest text-white/40 mb-2">Password</label>
                                <input type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-premium-neon transition">
                            </div>
                            <button onclick="showPage('dashboard')" class="w-full bg-premium-gradient py-4 rounded-xl font-black uppercase tracking-widest shadow-neon-glow mt-2 hover:scale-[1.02] active:scale-95 transition">Initialize Node</button>
                        </div>
                        <p class="text-center text-sm text-white/40 mt-8">Already active? <span onclick="showPage('login')" class="neon-text font-bold cursor-pointer hover:underline">Link Terminal</span></p>
                    </div>
                </div>
            `,
      dashboard: `
                <div class="lg:ml-64 transition-all">
                    <header class="mb-10">
                        <h1 class="text-4xl font-black text-white italic">DASH<span class="neon-text">BOARD</span></h1>
                        <p class="text-white/40">Welcome back, John. System status: <span class="text-green-500 font-bold uppercase text-xs">Optimal</span></p>
                    </header>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                        <div class="glass-card p-6 border-l-4 border-l-premium-neon">
                            <p class="text-[10px] font-black uppercase tracking-widest text-white/40">Total Balance</p>
                            <h2 class="text-3xl font-black mt-1">1,240.50 <span class="text-sm font-medium text-premium-neon italic">NVC</span></h2>
                        </div>
                        <div class="glass-card p-6 border-l-4 border-l-premium-purple">
                            <p class="text-[10px] font-black uppercase tracking-widest text-white/40">Mining ROI</p>
                            <h2 class="text-3xl font-black mt-1">+12.5% <span class="text-sm font-medium text-premium-purple italic">Weekly</span></h2>
                        </div>
                        <div class="glass-card p-6 border-l-4 border-l-green-500">
                            <p class="text-[10px] font-black uppercase tracking-widest text-white/40">Active Nodes</p>
                            <h2 class="text-3xl font-black mt-1">3 <span class="text-sm font-medium text-green-500 italic">Core</span></h2>
                        </div>
                        <div class="glass-card p-6 border-l-4 border-l-premium-gold">
                            <p class="text-[10px] font-black uppercase tracking-widest text-white/40">Hash Rate</p>
                            <h2 class="text-3xl font-black mt-1">45.8 <span class="text-sm font-medium text-premium-gold italic">TH/s</span></h2>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 glass-card p-8 rounded-2xl h-80 flex flex-col">
                            <h3 class="font-black uppercase tracking-widest text-xs mb-6 flex items-center gap-2">
                                <i data-lucide="bar-chart-3" class="w-4 h-4 text-premium-neon"></i>
                                Earnings Visualization
                            </h3>
                            <div class="flex-1 flex items-end gap-2">
                                ${[40, 60, 45, 90, 65, 80, 50, 70, 85, 95, 75, 88, 45, 70].map(h => `<div class="flex-1 bg-premium-gradient rounded-t-sm" style="height: ${h}%"></div>`).join('')}
                            </div>
                        </div>
                        <div class="glass-card p-8 rounded-2xl">
                            <h3 class="font-black uppercase tracking-widest text-xs mb-6">Recent Records</h3>
                            <div class="space-y-5">
                                <div class="flex items-center gap-4">
                                    <div class="w-8 h-8 rounded-full bg-green-500/10 flex items-center justify-center text-green-500">
                                        <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold">Node Reward</p>
                                        <p class="text-[10px] text-white/30 uppercase font-black">2m ago</p>
                                    </div>
                                    <div class="ml-auto text-sm font-black text-green-500">+0.005</div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="w-8 h-8 rounded-full bg-purple-500/10 flex items-center justify-center text-purple-500">
                                        <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold">Ref. Bonus</p>
                                        <p class="text-[10px] text-white/30 uppercase font-black">1h ago</p>
                                    </div>
                                    <div class="ml-auto text-sm font-black text-purple-500">+12.0</p>
                                </div>
                                <div class="flex items-center gap-4 opacity-50">
                                    <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-white">
                                        <i data-lucide="external-link" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold">Transfer Out</p>
                                        <p class="text-[10px] text-white/30 uppercase font-black">Yesterday</p>
                                    </div>
                                    <div class="ml-auto text-sm font-black">-50.0</div>
                                </div>
                            </div>
                            <button class="w-full mt-8 py-3 rounded-xl border border-white/10 text-[10px] font-black uppercase tracking-widest hover:bg-white/5 transition">View All Records</button>
                        </div>
                    </div>
                </div>
            `
    };

    function showPage(pageId) {
      const main = document.getElementById('main-content');
      const sidebar = document.getElementById('sidebar');

      main.innerHTML = pages[pageId] || pages.home;

      // Toggle sidebar visibility
      if (['dashboard', 'mining', 'wallet', 'shop', 'referral'].includes(pageId)) {
        sidebar.classList.remove('hidden');
        sidebar.classList.add('lg:block');
        main.classList.add('lg:ml-0');
      } else {
        sidebar.classList.add('hidden');
        sidebar.classList.remove('lg:block');
        main.classList.remove('lg:ml-64');
      }

      // Highlight active sidebar link
      document.querySelectorAll('.sidebar-link').forEach(link => {
        link.classList.remove('active');
        if (link.innerText.toLowerCase().includes(pageId)) {
          link.classList.add('active');
          const icon = link.querySelector('i');
          if (icon) icon.className = icon.className.replace('text-white/60', 'text-white');
        }
      });

      lucide.createIcons();
      window.scrollTo(0, 0);
    }

    // Initialize with home page
    showPage('home');
  </script>
</body>

</html>
